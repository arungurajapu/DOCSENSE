
name: Feature Request
description: Propose a new DocSense feature.
title: "[FEATURE] "
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem are we solving?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: Functional Requirements
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: How will we know this feature works?
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Technical Constraints
    validations:
      required: false
